# Live-fire check of the Scribe v2 Realtime dialect against the real
# ElevenLabs API (scripts/scribe-live-test.mjs). It spends a few
# seconds of transcription credit per run, so it only runs on demand
# or when the harness itself changes. The key comes from the
# ELEVENLABS_API_KEY repo secret — write-only, masked in logs.
name: scribe-live-test

on:
  workflow_dispatch:
  # any touch to the harness re-runs it — the dispatch API needs app
  # permissions the integration doesn't have, a push always works
  push:
    paths:
      - "scripts/scribe-live-test.mjs"
      - ".github/workflows/scribe-live-test.yml"

jobs:
  live-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synthesize a spoken sample
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          # multi-sentence with real pauses (periods + word gap), so the
          # streaming cadence — and VAD's phrase commits — have something
          # to work with, the way natural dictation does
          espeak-ng -w /tmp/speech.wav -s 150 -g 6 \
            "The quick brown fox jumped over the lazy dog. On a bright July morning, I walked down to the harbor. The water was calm and gray. And I finally wrote it all down."
      - name: Stream it to Scribe v2 Realtime
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/scribe-live-test.mjs /tmp/speech.wav fox morning harbor
